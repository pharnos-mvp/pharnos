name: CI

# PR-only (économie de quota Actions) : le squash-merge reproduit à l'identique le head de PR
# déjà validé — re-tester sur push main doublait les minutes pour zéro information nouvelle.
# `workflow_dispatch` reste disponible pour relancer manuellement sur main si besoin.
on:
  pull_request:
    paths-ignore: ['docs/**', '**.md', 'RA-source/**']
  workflow_dispatch:

permissions:
  contents: read

# Un push qui en remplace un autre sur la même branche annule le run précédent
# (économie directe de minutes sur les itérations rapides).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: web (typecheck · lint · format · test · build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        # npm install (et non npm ci) : le lockfile généré sous Windows n'inclut pas les
        # dépendances optionnelles Linux (@emnapi/* — fallback wasm de Tailwind/oxide).
        # npm install résout les bonnes deps par plateforme tout en respectant le lock.
        run: npm install --no-audit --no-fund

      - name: Audit (vulnérabilités npm, high+)
        # Garde-fou sécurité continu : échoue si une vulnérabilité high/critical apparaît
        # dans l'arbre de dépendances (les advisories low/moderate ne bloquent pas un PR).
        run: npm audit --audit-level=high

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Test (avec coverage + plancher anti-régression)
        run: npm run test:coverage

      - name: Upload coverage (lcov)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: web/coverage/
          retention-days: 14

      - name: Build
        run: npm run build

      - name: Bundle budget (gzip)
        run: npm run budget

      - name: Headers de sécurité (_headers Cloudflare)
        run: npm run headers

      # ── CTD Builder (offre sur licence, servie sur builder.pharnos.com) ──
      # Il partage `src/` avec la plateforme : un import ajouté ici peut lui faire entrer une
      # capacité de sortie réseau sans que personne le voie. Le build ÉCHOUE dans ce cas
      # (`src/builder/isolation.ts`) — c'est la garantie « vos documents ne transitent jamais par
      # les serveurs de Pharnos », vérifiée à chaque PR plutôt que promise.
      - name: Build CTD Builder (isolation réseau vérifiée)
        run: npm run build:builder

      - name: Headers CTD Builder (CSP — connect-src 'self' exact)
        run: npm run headers:builder

      # Le builder s'installe sur des postes de laboratoire et doit être ENTIÈREMENT chargé pour
      # fonctionner hors ligne : il n'a pas le luxe du chargement à la demande. Le plafond se
      # relève à la main, dans le commit qui l'a fait grossir — jamais par dérive silencieuse.
      - name: Budget de poids du CTD Builder (gzip par famille de fichiers)
        run: npm run budget:builder

      - name: Landing EN prérendu synchronisé (SEO /en/)
        # /en/ est GÉNÉRÉ depuis les sources FR de landing/. On régénère et on exige zéro diff :
        # toute modif d'une source non répercutée dans son miroir fait échouer la CI (anti-dérive).
        run: |
          npm run build:landing-en
          git diff --exit-code -- ../landing/en/

      - name: Modèles de la Bibliothèque synchronisés (source ↔ sortie générée)
        # `landing/modeles/` et son manifeste sont GÉNÉRÉS depuis `scripts/lib/modeles-source.mjs`,
        # et `landing/` est déployé TEL QUEL : committer la source sans régénérer la sortie met en
        # ligne un code et une donnée désaccordés. C'est arrivé — le manifeste servi n'avait pas le
        # drapeau `libelles`, et le tableau de la déclaration DMF retombait sur un rendu grille,
        # sans que rien ne le signale. Le générateur est reproductible à l'octet près : deux
        # exécutions donnent les mêmes fichiers, donc un diff non vide est une vraie dérive.
        run: |
          npm run build:landing-modeles
          git diff --exit-code -- ../landing/modeles/ ../landing/checking/modeles-manifest.js ../landing/checking/modeles-index.js

      - name: Barème Checking Standard synchronisé (page ↔ Edge)
        # `supabase/functions/_shared/checking/` est une COPIE de `landing/checking/` : l'Edge doit
        # rester autonome (aucun import hors de supabase/) SANS pouvoir diverger de la page.
        run: |
          npm run build:checking-bareme
          git diff --exit-code -- ../supabase/functions/_shared/checking/

  e2e:
    name: e2e (Playwright · offline PWA)
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ hashFiles('web/package-lock.json') }}

      - name: Install Playwright browser
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: E2E (build + preview + tests)
        run: npm run e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 7

  rls:
    name: rls (pgTAP · isolation tenant)
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start Supabase (sans les services superflus — pgTAP ne tape que Postgres)
        # `supabase test db` n'a besoin que de Postgres. edge-runtime cold-fetch des deps deno
        # « latest » à son démarrage et rate régulièrement son health check (Error status 502) →
        # faisait échouer tout `supabase start`. On l'exclut, avec les autres services lourds et
        # inutiles ici (studio/imgproxy/logflare/vector).
        run: supabase start -x edge-runtime,studio,imgproxy,logflare,vector

      - name: RLS pgTAP (isolation multi-tenant)
        run: supabase test db

  lighthouse:
    name: lighthouse (perf · a11y)
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        working-directory: web
        run: npm install --no-audit --no-fund

      - name: Build (mode local — sans secret, app accessible sans login)
        working-directory: web
        run: npm run build

      - name: Lighthouse CI (mesure perf/a11y, assertions non bloquantes)
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: ./lighthouserc.json
          uploadArtifacts: true
          temporaryPublicStorage: true

  edge:
    name: edge (deno · modules partagés)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      # Politique de retry (transitoires only), circuit breaker, whitelist CORS : la logique
      # partagée des Edge Functions est testée en pur (sans réseau ni Supabase).
      - name: Tests modules partagés Edge
        # `--allow-read` : la recette « hôtes-jumeaux » de `checkout-core.test.ts` LIT
        # `landing/_headers` — c'est son seul moyen de vérifier qu'un hôte accepté par le serveur
        # est bien cadrable par la CSP, les deux listes vivant dans deux fichiers. Sans ce droit,
        # Deno la refuse et le job échoue en bloquant toute la branche. Lecture seule, périmètre
        # limité au dépôt : aucun test n'écrit ni n'ouvre le réseau.
        #
        # `landing/` est ajouté pour le PONT du paiement (`landing/modele/pont.js`) : c'est du code
        # de la landing, il ne doit donc PAS entrer dans le paquet d'une Edge Function via une copie
        # sous `_shared/`. Un test, lui, n'a pas cette contrainte — il tourne à la racine du dépôt.
        run: deno test --allow-read supabase/functions/_shared/ landing/

      - name: Type-check des Edge Functions
        run: deno check supabase/functions/regafy-ai/index.ts supabase/functions/translate/index.ts supabase/functions/upgrade/index.ts supabase/functions/share/index.ts supabase/functions/admin/index.ts supabase/functions/team/index.ts supabase/functions/lifecycle-reminders/index.ts supabase/functions/retention-purge/index.ts supabase/functions/purge-dossier/index.ts supabase/functions/demo-request/index.ts supabase/functions/invite-info/index.ts supabase/functions/checking-report/index.ts supabase/functions/checkout/index.ts supabase/functions/bench/index.ts supabase/functions/chariow-pulse/index.ts supabase/functions/order-claim/index.ts supabase/functions/order-upload-url/index.ts supabase/functions/order-gate/index.ts supabase/functions/job-tick/index.ts supabase/functions/order-status/index.ts supabase/functions/order-source/index.ts

  secrets:
    name: secrets (gitleaks · historique complet)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Tout l'historique : un secret commité puis « supprimé » reste exposé dans git.
          fetch-depth: 0

      # Binaire officiel via Docker (licence MIT, pas de clé requise — contrairement à
      # gitleaks-action qui exige une licence pour les organisations). --redact : ne jamais
      # afficher la valeur d'un secret détecté dans les logs CI.
      # ⚠️ `--gitleaks-ignore-path` est INDISPENSABLE ici : sa valeur par défaut est « . », le
      # répertoire courant DU CONTENEUR (/), pas `--source`. Sans lui, le `.gitleaksignore` du
      # dépôt n'est jamais lu et une exception épinglée reste invisible — la CI échoue sans rien
      # dire de plus qu'avant, ce qui se diagnostique très mal.
      - name: Gitleaks (scan des secrets sur tout l'historique git)
        run: >
          docker run --rm -v "$PWD:/repo"
          ghcr.io/gitleaks/gitleaks:latest
          detect --source=/repo --gitleaks-ignore-path=/repo --redact --no-banner
